server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compression
  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

  # Hashed build assets: cache aggressively
  location /assets/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Static files
  location ~* \.(?:svg|png|jpg|jpeg|webp|ico|woff2?|webmanifest)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public";
  }

  # SPA fallback — every route serves index.html so client-side routing works
  location / {
    try_files $uri $uri/ /index.html;
  }
}
