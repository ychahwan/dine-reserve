# ---------------------------------------------------------------------------
# Kamix — Render Blueprint
#
# Deploys the web admin / customer / restaurant apps as a single Web Service.
# All apps share the same codebase and connect to the hosted Convex backend.
#
# Usage:
#   1. Push this repo to GitHub/GitLab.
#   2. In Render dashboard → New → Blueprint, connect the repo.
#   3. Set VITE_CONVEX_URL in Render env vars to your Convex deployment URL.
#
# Or use the CLI:
#   render blueprint apply render.yaml
# ---------------------------------------------------------------------------

services:
  - type: web
    name: kamix
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    envVars:
      - key: VITE_CONVEX_URL
        sync: false  # Set manually in Render dashboard
      - key: NODE_ENV
        value: production
    healthCheckPath: /
    autoDeploy: true
